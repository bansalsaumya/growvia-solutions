<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <radialGradient id="bg" cx="55%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1f1f24"/>
      <stop offset="55%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e10600" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8b8c2"/>
      <stop offset="28%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d4d4dc"/>
      <stop offset="82%" stop-color="#9e9ea8"/>
      <stop offset="100%" stop-color="#e8e8ee"/>
    </linearGradient>
    <linearGradient id="colaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e17"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="lemonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe033"/>
      <stop offset="100%" stop-color="#d4a000"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8524"/>
      <stop offset="100%" stop-color="#d94e00"/>
    </linearGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b82990"/>
      <stop offset="100%" stop-color="#68114f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="760" cy="360" r="340" fill="url(#redGlow)"/>

  <!-- Giant Watermark Text -->
  <text x="600" y="420" font-family="Impact, Arial Black, sans-serif" font-size="250" font-weight="900" fill="#ffffff" opacity="0.035" text-anchor="middle" letter-spacing="10">FIZZÉ 3D</text>

  <!-- Top Browser Bar Frame -->
  <g transform="translate(60, 44)">
    <rect width="1080" height="632" rx="22" fill="#18181d" stroke="#2e2e38" stroke-width="2" filter="url(#shadow)"/>
    <rect width="1080" height="48" rx="22" fill="#22222a"/>
    <circle cx="28" cy="24" r="7" fill="#ff5f56"/>
    <circle cx="50" cy="24" r="7" fill="#ffbd2e"/>
    <circle cx="72" cy="24" r="7" fill="#27c93f"/>
    <rect x="340" y="11" width="400" height="26" rx="13" fill="#141419" stroke="#343442"/>
    <text x="540" y="29" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#a0a0b0" text-anchor="middle">🔒 https://fizze.vercel.app</text>
    <rect x="910" y="12" width="145" height="24" rx="12" fill="#e10600"/>
    <text x="982" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3D WEBGL + GSAP</text>
  </g>

  <!-- Left Hero Content Inside Frame -->
  <g transform="translate(115, 145)">
    <rect x="0" y="0" width="275" height="32" rx="16" fill="#2a1215" stroke="#e10600" stroke-width="1.5"/>
    <text x="137" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#ff4d47" text-anchor="middle" letter-spacing="1">★ GROWVIA 3D CONCEPT LAB</text>

    <text x="0" y="108" font-family="Impact, Arial Black, sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="2">POP. POUR.</text>
    <text x="0" y="192" font-family="Impact, Arial Black, sans-serif" font-size="86" font-weight="900" fill="#e10600" letter-spacing="2">FIZZÉ.</text>

    <text x="0" y="236" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#c4c4d0">Interactive 3D Scrollytelling &amp; D2C Beverage Store</text>
    <text x="0" y="264" font-family="Arial, sans-serif" font-size="14" fill="#8f8fa0">• Procedural Three.js 3D Cans &amp; Live Pour Physics</text>
    <text x="0" y="288" font-family="Arial, sans-serif" font-size="14" fill="#8f8fa0">• GSAP ScrollTrigger + Lenis Smooth Scroll</text>
    <text x="0" y="312" font-family="Arial, sans-serif" font-size="14" fill="#8f8fa0">• Custom 3D Name Personalizer &amp; WhatsApp Cart</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 345)">
      <rect x="0" y="0" width="128" height="38" rx="19" fill="#e10600"/>
      <text x="64" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">THREE.JS 3D</text>

      <rect x="140" y="0" width="138" height="38" rx="19" fill="#252530" stroke="#3f3f50"/>
      <text x="209" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">GSAP SCROLL</text>

      <rect x="290" y="0" width="142" height="38" rx="19" fill="#252530" stroke="#3f3f50"/>
      <text x="361" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">100% SEO READY</text>
    </g>

    <!-- Metrics Strip -->
    <g transform="translate(0, 415)">
      <rect x="0" y="0" width="432" height="74" rx="14" fill="#1f1f27" stroke="#323240"/>
      <text x="30" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff">4 Flavours</text>
      <text x="30" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#8f8fa0">LIVE 3D MORPHING</text>

      <line x1="165" y1="14" x2="165" y2="60" stroke="#323240"/>
      <text x="190" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#ff4d47">60 FPS</text>
      <text x="190" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#8f8fa0">WEBGL RENDERER</text>

      <line x1="305" y1="14" x2="305" y2="60" stroke="#323240"/>
      <text x="328" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#27c93f">0g Sugar</text>
      <text x="328" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#8f8fa0">D2C SHOWCASE</text>
    </g>
  </g>

  <!-- Right Side: Secondary Supporting Cans (Lemon & Berry) -->
  <!-- Lemon Can (Back Left of Can Group) -->
  <g transform="translate(690, 385) rotate(-16) scale(0.76)" filter="url(#shadow)">
    <rect x="-85" y="-175" width="170" height="350" rx="24" fill="url(#canMetal)"/>
    <rect x="-85" y="-152" width="170" height="24" fill="url(#lemonGrad)"/>
    <path d="M-85,35 Q-42,10 0,35 T85,35 L85,150 Q85,175 60,175 L-60,175 Q-85,175 -85,150 Z" fill="url(#lemonGrad)"/>
    <text x="0" y="-15" font-family="Impact, Arial Black, sans-serif" font-size="62" font-weight="900" fill="#c79800" text-anchor="middle">FIZZÉ</text>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#222" text-anchor="middle">LEMON ZEST</text>
  </g>

  <!-- Berry Can (Back Right of Can Group) -->
  <g transform="translate(985, 395) rotate(15) scale(0.76)" filter="url(#shadow)">
    <rect x="-85" y="-175" width="170" height="350" rx="24" fill="url(#canMetal)"/>
    <rect x="-85" y="-152" width="170" height="24" fill="url(#berryGrad)"/>
    <path d="M-85,35 Q-42,10 0,35 T85,35 L85,150 Q85,175 60,175 L-60,175 Q-85,175 -85,150 Z" fill="url(#berryGrad)"/>
    <text x="0" y="-15" font-family="Impact, Arial Black, sans-serif" font-size="62" font-weight="900" fill="#8a1d6b" text-anchor="middle">FIZZÉ</text>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#222" text-anchor="middle">BERRY BLAST</text>
  </g>

  <!-- Center Hero Can: Classic Cola 3D -->
  <g transform="translate(840, 365) rotate(-5)" filter="url(#shadow)">
    <!-- Rim Top -->
    <ellipse cx="0" cy="-198" rx="92" ry="14" fill="#e4e4ec" stroke="#999" stroke-width="2"/>
    <!-- Main Cylinder -->
    <rect x="-98" y="-195" width="196" height="390" rx="28" fill="url(#canMetal)" stroke="#d0d0d8" stroke-width="2"/>
    <!-- Top Red Band -->
    <rect x="-98" y="-168" width="196" height="28" fill="url(#colaGrad)"/>
    <!-- Bottom Wave Red Fill -->
    <path d="M-98,45 Q-49,15 0,45 T98,45 L98,167 Q98,195 70,195 L-70,195 Q-98,195 -98,167 Z" fill="url(#colaGrad)"/>
    <!-- Brand Typography -->
    <text x="0" y="-22" font-family="Impact, Arial Black, sans-serif" font-size="78" font-weight="900" fill="#e10600" text-anchor="middle" letter-spacing="2">FIZZÉ</text>
    <rect x="-74" y="-4" width="148" height="30" rx="8" fill="#141418"/>
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">CLASSIC COLA</text>
    <text x="0" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ZERO SUGAR · 330 ML</text>
    <text x="0" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffd6d4" text-anchor="middle">★ CUSTOM 3D CAN ★</text>
    <!-- Water Condensation Droplets -->
    <circle cx="-62" cy="-95" r="5" fill="#ffffff" opacity="0.75"/>
    <circle cx="58" cy="-70" r="4" fill="#ffffff" opacity="0.75"/>
    <circle cx="-48" cy="85" r="5.5" fill="#ffffff" opacity="0.65"/>
    <circle cx="65" cy="95" r="4" fill="#ffffff" opacity="0.7"/>
    <circle cx="25" cy="-120" r="3.5" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Floating Fizz Bubbles -->
  <circle cx="660" cy="180" r="10" fill="none" stroke="#ff4d47" stroke-width="2" opacity="0.6"/>
  <circle cx="1010" cy="175" r="14" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
  <circle cx="730" cy="590" r="8" fill="#e10600" opacity="0.6"/>
  <circle cx="960" cy="585" r="11" fill="none" stroke="#ffbd2e" stroke-width="2" opacity="0.5"/>
</svg>

